name: Automated Backtest Runner

# TRiggers: Controls when GitHub runs this script
on:
  push:
    branches: [ "main" ]     # Trigger on code upload
  schedule:
    - cron: '0 0 * * 1'      # Automatic scheduled run: Every Monday at 00:00 UTC
  workflow_dispatch:         # Adds a "Run Manually" button on GitHub's dashboard

jobs:
  run-backtest-job:
    runs-on: ubuntu-latest   # Spawns a virtual Linux machine in the cloud

    steps:
    # Step 1: Copy your project files into the cloud environment
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # Step 2: Set up Python 3.11 on the cloud environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'          # Caches libraries to make future runs faster

    # Step 3: Install required packages from requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Execute the backtest script
    - name: Run Main Script
      run: python main.py

    # Step 5: Save generated text report so you can download it from GitHub
    - name: Upload Results Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backtest-report-file
        path: results/backtest_report.txt